<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>memtest — laya-bot-det</title>
<style>
  :root { color-scheme: dark; background:#1a1a1a; color:#d4d4d4; }
  body { margin:0; padding:20px 16px; font-family:system-ui,"Hiragino Sans",sans-serif; line-height:1.8; }
  h1 { font-size:18px; margin:0 0 4px; }
  p { margin:6px 0; font-size:14px; }
  .dim { color:#8a8a8a; font-size:13px; }
  .big { font-size:34px; font-weight:700; font-variant-numeric:tabular-nums; }
  .ok { color:#5aa9e0; } .bad { color:#e0685a; }
  button { background:#232323; color:#d4d4d4; border:1px solid #343434; border-radius:6px;
           padding:10px 16px; font-size:15px; cursor:pointer; margin:4px 4px 4px 0; }
  #log { font-family:ui-monospace,monospace; font-size:12px; color:#8a8a8a;
         white-space:pre-wrap; margin-top:12px; }
  .box { border:1px solid #343434; border-radius:8px; padding:12px; margin:12px 0; background:#232323; }
</style>
</head>
<body>
<h1>memtest</h1>
<p class="dim">このブラウザが JS のバッファをどこまで確保できるかを測ります。
Laya (int8) を動かすには <b>約 800 MB</b>、fp16 なら <b>約 1.3 GB</b> 必要です。</p>

<div class="box">
  <div class="dim">前回このブラウザが到達した最大値</div>
  <div class="big" id="best">—</div>
  <div class="dim" id="verdict"></div>
</div>

<p>
  <button id="run">測定する</button>
  <button id="reset">記録を消す</button>
</p>
<p class="dim">タブが落ちたら、それが上限です。落ちても記録は残るので、
<b>開き直してこのページに戻ってきてください</b>。上に最大値が出ます。</p>

<div class="box">
  <div class="dim">wasm のスレッド条件</div>
  <div id="threads" class="dim"></div>
</div>

<div class="box">
  <div class="dim">WebGPU がこの端末で何を許しているか</div>
  <div id="gpu" class="dim">調べています…</div>
  <p><button id="gpubuf">モデルと同じ大きさで1本確保してみる</button></p>
  <div id="gpulog" class="dim"></div>
</div>

<div class="box">
  <div class="dim">連続した 1 本を確保できるか（ここが本番の条件）</div>
  <p>
    <button id="contig">ArrayBuffer 1本</button>
    <button id="wasmmem">WebAssembly メモリ</button>
    <button id="both">両方を同時に</button>
    <button id="wasmgrow">wasm を grow で伸ばす（本番と同じ）</button>
  </p>
  <div id="contiglog" class="dim"></div>
</div>

<div id="log"></div>

<script>
// 確保のたびに到達点を localStorage へ書く。タブが殺されると JS の状態は消えるが、
// localStorage は残る。そこが測定結果の保存先になる。
var KEY = "laya-memtest-best";
var STEP = 64 * 1024 * 1024;
var LIMIT = 2048 * 1024 * 1024;
var MB = function (n) { return Math.round(n / 1048576); };

var bestEl = document.getElementById("best");
var verdictEl = document.getElementById("verdict");
var logEl = document.getElementById("log");

function read() { try { return Number(localStorage.getItem(KEY)) || 0; } catch (e) { return 0; } }
function write(v) { try { localStorage.setItem(KEY, String(v)); } catch (e) {} }

function show() {
  var best = read();
  bestEl.textContent = best ? MB(best) + " MB" : "—";
  if (!best) { verdictEl.textContent = ""; return; }
  var int8 = best >= 800 * 1048576, fp16 = best >= 1300 * 1048576;
  verdictEl.innerHTML =
    '<span class="' + (int8 ? "ok" : "bad") + '">int8 (約800MB): ' + (int8 ? "足りる" : "足りない") + "</span> ・ " +
    '<span class="' + (fp16 ? "ok" : "bad") + '">fp16 (約1.3GB): ' + (fp16 ? "足りる" : "足りない") + "</span>";
}

function log(s) { logEl.textContent += s + "\n"; }

document.getElementById("reset").onclick = function () {
  try { localStorage.removeItem(KEY); } catch (e) {}
  logEl.textContent = ""; show();
};

document.getElementById("run").onclick = function () {
  this.disabled = true;
  logEl.textContent = "";
  var held = [], total = 0;
  function step() {
    if (total >= LIMIT) { log("上限 " + MB(LIMIT) + " MB まで到達。ここで停止。"); return; }
    try {
      var b = new Uint8Array(STEP);
      // 確保しただけでは OS が実メモリを割り当てないことがある。全ページに触れて
      // 実際にコミットさせないと、測っているものが意味を持たない。
      for (var i = 0; i < b.length; i += 4096) b[i] = 1;
      held.push(b);
      total += STEP;
      write(total);              // 次の確保で落ちる前に記録する
      log(MB(total) + " MB OK");
      show();
    } catch (e) {
      log(MB(total + STEP) + " MB で失敗: " + e.name + " — ここが上限です");
      return;
    }
    // 描画と localStorage の書き込みを挟むため、同期ループにしない
    setTimeout(step, 60);
  }
  step();
};

show();

// ---- 連続確保 ----
// 上の測定は 64 MB を 32 個ばらばらに取っただけで、合計 2 GB に届いた。
// だが onnxruntime が要求するのは「連続した 1 本」で、断片化した空きが
// いくら合っても足りない。wasm の線形メモリはさらに厳しく、成長のたびに
// 新しい連続領域を取り直す。ここが本番の条件。
var contigLog = document.getElementById("contiglog");

document.getElementById("contig").onclick = async function () {
  this.disabled = true;
  contigLog.textContent = "";
  var sizes = [325, 647, 775, 1000, 1300];
  for (var i = 0; i < sizes.length; i++) {
    var mb = sizes[i];
    try {
      var b = new Uint8Array(mb * 1048576);
      for (var j = 0; j < b.length; j += 65536) b[j] = 1;   // 実際にコミットさせる
      contigLog.textContent += "ArrayBuffer " + mb + " MB 1本: OK\n";
      b = null;
    } catch (e) {
      contigLog.textContent += "ArrayBuffer " + mb + " MB 1本: 失敗 " + e.name + "\n";
      break;
    }
    await new Promise(function (r) { setTimeout(r, 150); });
  }
  contigLog.textContent += "終了\n";
  this.disabled = false;
};

document.getElementById("wasmmem").onclick = async function () {
  this.disabled = true;
  contigLog.textContent = "";
  var PAGE = 65536;
  // create() の中では、生の重みと ORT が組み直した表現が同時に wasm ヒープに
  // 乗る。必要なのはモデルサイズの 2 倍前後で、647MB なら 1.3GB 以上を 1 本の
  // 線形メモリとして要求する。775 MB までしか測っていなかった。
  var sizes = [325, 650, 775, 1000, 1300, 1600, 2000, 2500];
  for (var i = 0; i < sizes.length; i++) {
    var mb = sizes[i], pages = Math.ceil((mb * 1048576) / PAGE);
    try {
      var mem = new WebAssembly.Memory({ initial: pages });
      var view = new Uint8Array(mem.buffer);
      for (var j = 0; j < view.length; j += PAGE) view[j] = 1;
      contigLog.textContent += "wasm メモリ " + mb + " MB: OK\n";
      mem = null; view = null;
    } catch (e) {
      contigLog.textContent += "wasm メモリ " + mb + " MB: 失敗 " + e.name + " " + e.message + "\n";
      break;
    }
    await new Promise(function (r) { setTimeout(r, 150); });
  }
  contigLog.textContent += "終了\n";
  this.disabled = false;
};

// 本番では両方が同時に生きる。ダウンロードで組み立てた ArrayBuffer を
// onnxruntime に渡すと、create が終わるまで元のバッファは解放できず、
// wasm 側のコピーと並んで存在する。上の 2 つのボタンは 1 つずつ試して
// 都度解放していたので、この条件を測っていなかった。
// onnxruntime は小さく確保してから grow() で伸ばす。初期値で一括確保するのとは
// 挙動が違うことがあるので、そちらも測る。ここが本番と同じ形。
document.getElementById("wasmgrow").onclick = async function () {
  this.disabled = true;
  contigLog.textContent = "";
  var PAGE = 65536, STEP = 64 * 1048576 / PAGE;
  var mem;
  try { mem = new WebAssembly.Memory({ initial: STEP }); }
  catch (e) { contigLog.textContent = "初期確保に失敗: " + e; this.disabled = false; return; }
  var mb = 64;
  for (;;) {
    try {
      mem.grow(STEP);
      mb += 64;
      var v = new Uint8Array(mem.buffer);
      v[v.length - 1] = 1;
      if (mb % 256 === 0) contigLog.textContent += "grow して " + mb + " MB OK\n";
      if (mb >= 2560) { contigLog.textContent += "2560 MB まで到達。ここで停止。\n"; break; }
    } catch (e) {
      contigLog.textContent += "grow " + (mb + 64) + " MB で失敗: " + e.name + " " + e.message + "\n";
      break;
    }
    await new Promise(function (r) { setTimeout(r, 30); });
  }
  contigLog.textContent += "終了\n";
  this.disabled = false;
};

document.getElementById("both").onclick = async function () {
  this.disabled = true;
  contigLog.textContent = "";
  var PAGE = 65536;
  var cases = [[325, "int8"], [647, "fp16"]];
  for (var i = 0; i < cases.length; i++) {
    var mb = cases[i][0], label = cases[i][1];
    var js = null, mem = null;
    try {
      js = new Uint8Array(mb * 1048576);
      for (var j = 0; j < js.length; j += PAGE) js[j] = 1;
      contigLog.textContent += label + ": ArrayBuffer " + mb + " MB 確保\n";
      await new Promise(function (r) { setTimeout(r, 200); });
      mem = new WebAssembly.Memory({ initial: Math.ceil((mb * 1048576) / PAGE) });
      var view = new Uint8Array(mem.buffer);
      for (var k = 0; k < view.length; k += PAGE) view[k] = 1;
      contigLog.textContent += label + ": wasm " + mb + " MB も同時に確保 — 合計 " + (mb * 2) + " MB OK\n";
    } catch (e) {
      contigLog.textContent += label + ": 合計 " + (mb * 2) + " MB で失敗 " + e.name + "\n";
      js = null; mem = null;
      break;
    }
    js = null; mem = null;
    await new Promise(function (r) { setTimeout(r, 300); });
  }
  contigLog.textContent += "終了\n";
  this.disabled = false;
};

// マルチスレッド wasm は SharedArrayBuffer を要求し、それは COOP/COEP が
// 揃った文脈でしか存在しない。GitHub Pages は送らないので、スレッドを
// 要求すること自体が無意味であり、実装によっては落ちる。
(function () {
  var el = document.getElementById("threads");
  var sab = typeof SharedArrayBuffer !== "undefined";
  var iso = typeof crossOriginIsolated !== "undefined" ? crossOriginIsolated : false;
  el.innerHTML =
    "hardwareConcurrency: <b>" + (navigator.hardwareConcurrency || "?") + "</b><br>" +
    'SharedArrayBuffer: <span class="' + (sab ? "ok" : "bad") + '">' + (sab ? "あり" : "なし") + "</span><br>" +
    'crossOriginIsolated: <span class="' + (iso ? "ok" : "bad") + '">' + iso + "</span><br>" +
    (iso ? "マルチスレッド wasm が使える" : "<b>シングルスレッドで動かすしかない</b>");
})();

// ---- WebGPU ----
// JS のバッファが 2 GB 取れても、モデルを載せるのは GPU 側のバッファ。
// iOS の maxBufferSize は桁違いに小さいことがあり、超えるとエラーではなく
// タブごと落ちることがある。数字を見ないと切り分けられない。
var gpuEl = document.getElementById("gpu");
var gpuLog = document.getElementById("gpulog");
var adapter = null;

(async function () {
  if (!navigator.gpu) {
    gpuEl.innerHTML = '<span class="bad">navigator.gpu がありません（WebGPU 無効）</span>';
    return;
  }
  try {
    adapter = await navigator.gpu.requestAdapter();
    if (!adapter) { gpuEl.innerHTML = '<span class="bad">アダプタを取得できません</span>'; return; }
    var L = adapter.limits;
    var rows = [
      ["maxBufferSize", L.maxBufferSize],
      ["maxStorageBufferBindingSize", L.maxStorageBufferBindingSize],
      ["maxUniformBufferBindingSize", L.maxUniformBufferBindingSize],
    ];
    var html = "";
    for (var i = 0; i < rows.length; i++) {
      var mb = rows[i][1] / 1048576;
      html += rows[i][0] + ": <b>" + (mb >= 1 ? mb.toFixed(0) + " MB" : rows[i][1] + " B") + "</b><br>";
    }
    // モデルの重みは 1 本の大きなバッファに載るとは限らないが、上限が
    // モデルサイズを大きく下回るなら、そこが壁である可能性が高い。
    var fits325 = L.maxBufferSize >= 325 * 1048576;
    var fits647 = L.maxBufferSize >= 647 * 1048576;
    html += '<span class="' + (fits325 ? "ok" : "bad") + '">int8 325MB: ' + (fits325 ? "1本に収まる" : "1本には収まらない") + "</span> ・ ";
    html += '<span class="' + (fits647 ? "ok" : "bad") + '">fp16 647MB: ' + (fits647 ? "1本に収まる" : "1本には収まらない") + "</span>";
    gpuEl.innerHTML = html;
  } catch (e) {
    gpuEl.innerHTML = '<span class="bad">' + e + "</span>";
  }
})();

document.getElementById("gpubuf").onclick = async function () {
  this.disabled = true;
  gpuLog.textContent = "";
  if (!adapter) { gpuLog.textContent = "アダプタがありません"; return; }
  var device;
  try {
    device = await adapter.requestDevice({
      requiredLimits: { maxBufferSize: adapter.limits.maxBufferSize,
                        maxStorageBufferBindingSize: adapter.limits.maxStorageBufferBindingSize },
    });
  } catch (e) { gpuLog.textContent = "device を取れません: " + e; return; }
  device.addEventListener &&
    device.addEventListener("uncapturederror", function (ev) { gpuLog.textContent += "\nGPU error: " + ev.error; });
  // The sizes that matter are the two model files, taken as ONE buffer each --
  // that is what loading actually asks for. A ladder of small buffers can all
  // succeed while the single large one the model needs does not.
  var cases = [
    ["int8 モデル 1本", 325],
    ["fp16 モデル 1本", 647],
    ["fp16 + 作業領域", 647 + 128],
  ];
  for (var i = 0; i < cases.length; i++) {
    var label = cases[i][0], want = cases[i][1] * 1048576;
    if (want > adapter.limits.maxBufferSize) {
      gpuLog.textContent += label + " (" + cases[i][1] + " MB): maxBufferSize 超え — 確実に不可\n";
      continue;
    }
    var buf = null;
    try {
      buf = device.createBuffer({ size: want, usage: GPUBufferUsage.STORAGE });
      // createBuffer can return an invalid buffer without throwing; the error
      // only surfaces through the error scope.
      device.pushErrorScope("out-of-memory");
      var err = await device.popErrorScope();
      gpuLog.textContent += label + " (" + cases[i][1] + " MB): " + (err ? "失敗 " + err.message : "OK") + "\n";
      buf.destroy();
    } catch (e) {
      gpuLog.textContent += label + " (" + cases[i][1] + " MB): 例外 " + e.name + " " + e.message + "\n";
    }
    await new Promise(function (r) { setTimeout(r, 120); });
  }
  gpuLog.textContent += "終了";
};
</script>
</body>
</html>
